<title>每日速读</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: phone-first "clear" UI — soft lit ground, translucent white cards floating on light and shadow,
   big light-weight numbers, one violet glow per screen (the 速读 button), capsule tab bar fixed at the bottom. */
:root{
  --ground:#eceef3; --glow-a:#e6e0fa; --glow-b:#dce8f7;
  --card:rgba(255,255,255,.74); --card-solid:#ffffff; --card-edge:rgba(255,255,255,.95);
  --well:rgba(236,238,243,.8);
  --ink:#15171c; --ink-2:#555a68; --ink-3:#6c7181; --hair:rgba(21,23,28,.08);
  --accent:#6c5ce7; --accent-glow:rgba(108,92,231,.38); --accent-ink:#ffffff; --accent-soft:rgba(108,92,231,.12);
  --up:#15803d; --down:#c62828; --flat:#6b7080;
  --shadow:0 18px 40px -18px rgba(40,44,70,.22), 0 2px 6px rgba(40,44,70,.05);
  --f-num:"Sora","Noto Sans SC",system-ui,sans-serif;
  --f-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --r-xl:30px; --r-lg:22px; --r-md:14px;
  --tabbar-h:76px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#0f1116; --glow-a:#231d3d; --glow-b:#14243a;
  --card:rgba(30,33,43,.72); --card-solid:#1c1f28; --card-edge:rgba(255,255,255,.07);
  --well:rgba(12,14,19,.55);
  --ink:#eef0f5; --ink-2:#a9aebb; --ink-3:#8f95a6; --hair:rgba(255,255,255,.08);
  --accent:#9d8fff; --accent-glow:rgba(157,143,255,.35); --accent-ink:#15122b; --accent-soft:rgba(157,143,255,.14);
  --up:#4ade80; --down:#f87171; --flat:#9aa0ad;
  --shadow:0 18px 40px -18px rgba(0,0,0,.6), 0 2px 6px rgba(0,0,0,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#0f1116; --glow-a:#231d3d; --glow-b:#14243a;
  --card:rgba(30,33,43,.72); --card-solid:#1c1f28; --card-edge:rgba(255,255,255,.07);
  --well:rgba(12,14,19,.55);
  --ink:#eef0f5; --ink-2:#a9aebb; --ink-3:#8f95a6; --hair:rgba(255,255,255,.08);
  --accent:#9d8fff; --accent-glow:rgba(157,143,255,.35); --accent-ink:#15122b; --accent-soft:rgba(157,143,255,.14);
  --up:#4ade80; --down:#f87171; --flat:#9aa0ad;
  --shadow:0 18px 40px -18px rgba(0,0,0,.6), 0 2px 6px rgba(0,0,0,.3);
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(60% 40% at 100% 0%,var(--glow-a),transparent 70%),
             radial-gradient(55% 45% at 0% 100%,var(--glow-b),transparent 70%)}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}

.app{position:relative;z-index:1;max-width:480px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:18px calc(var(--tabbar-h) + 36px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:14px}

.card{background:var(--card);border-radius:var(--r-xl);box-shadow:var(--shadow), inset 0 1px 0 var(--card-edge);
  border:1px solid var(--card-edge);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:20px}
.well{background:var(--well);border-radius:var(--r-lg);padding:14px 16px}
.label{font-size:13px;color:var(--ink-2)}
.small{font-size:12px;color:var(--ink-3)}

/* header */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:4px 4px 2px}
.top .date{font-size:13px;color:var(--ink-2);font-family:var(--f-num)}
.top h1{margin:0;font-size:26px;font-weight:600;letter-spacing:-.01em;line-height:1.25;text-wrap:balance}
.ring{position:relative;width:52px;height:52px;flex:none}
.ring svg{width:52px;height:52px;display:block}
.ring circle{fill:none;stroke-width:4}
.ring .t{stroke:var(--hair)} .ring .b{stroke:var(--ink);stroke-linecap:round;transition:stroke-dashoffset .5s}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-num);font-size:12px;font-variant-numeric:tabular-nums}

/* hero */
.hero .head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px 12px;flex-wrap:wrap}
.hero .head > div{min-width:0}
.bignum{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-top:2px}
.bignum b{font-family:var(--f-num);font-weight:300;font-size:46px;line-height:1.05;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bignum i{font-style:normal;font-size:16px;color:var(--ink-2)}
.chg{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-num);font-size:13px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--well);white-space:nowrap}
.chg.up{color:var(--up)} .chg.down{color:var(--down)} .chg.flat{color:var(--flat)}
.spark{position:relative;margin-top:10px}
.spark svg{display:block;width:100%;height:auto;overflow:visible}
.spark .line{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.spark .area{fill:var(--ink);opacity:.06}
.spark .end{fill:var(--card-solid);stroke:var(--ink);stroke-width:2}
.spark .bubble{position:absolute;transform:translate(-50%,-130%);background:var(--ink);color:var(--card-solid);font-family:var(--f-num);font-size:12px;
  padding:3px 9px;border-radius:999px;white-space:nowrap;pointer-events:none}
.ticks{display:flex;justify-content:space-between;font-family:var(--f-num);font-size:11px;color:var(--ink-3);margin-top:6px;padding:0 2px}
.src-line{margin-top:10px}
.src-line a{color:var(--ink-3)}

/* mix */
.mix .bar{display:flex;gap:3px;height:12px;margin:12px 0 10px}
.mix .bar span{display:block;height:100%;border-radius:6px;min-width:6px}
.mix .seg-cn{background:var(--accent)} .mix .seg-gl{background:var(--ink-3);opacity:.55}
.mix .legend{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.mix .legend b{font-family:var(--f-num);font-weight:400;font-size:22px;margin-left:6px;font-variant-numeric:tabular-nums}
.cats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:var(--well);font-size:13px;color:var(--ink-2)}
.pill b{font-family:var(--f-num);font-weight:600;color:var(--ink)}

/* tldr */
.tldr h2,.sec-title{margin:0 0 10px;font-size:13px;font-weight:500;color:var(--ink-2)}
.tldr ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:t}
.tldr li{display:grid;grid-template-columns:22px 1fr;gap:8px;font-weight:500;font-size:16px;line-height:1.5;counter-increment:t}
.tldr li::before{content:counter(t);font-family:var(--f-num);font-size:12px;color:var(--ink-3);padding-top:3px}
.takeaway{margin-top:14px;font-size:14px;color:var(--ink-2)}

/* markets */
.markets{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 6px;margin:0 -2px}
.markets::-webkit-scrollbar{display:none}
.mkt{flex:none;min-width:128px;padding:14px 16px;border-radius:var(--r-lg)}
.mkt .v{font-family:var(--f-num);font-size:19px;font-weight:400;font-variant-numeric:tabular-nums;margin:2px 0}

/* reader */
.reader{display:flex;flex-direction:column;gap:12px}
.dots{display:flex;gap:4px;padding:0 6px}
.dots .dot{flex:1;height:4px;border-radius:2px;background:var(--hair);transition:background .3s}
.dots .dot.seen{background:var(--ink-3)}
.dots .dot[aria-current="true"]{background:var(--ink)}
.track{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  padding:4px max(16px,env(safe-area-inset-left,0px)) 18px;scroll-padding-inline:max(16px,env(safe-area-inset-left,0px));overscroll-behavior-x:contain}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;gap:14px;min-width:0}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--well);color:var(--ink-2)}
.tag.dev{background:transparent;border:1px dashed var(--ink-3)}
.tag.key{background:var(--ink);color:var(--card-solid)}
.slide h2{margin:0;font-size:22px;font-weight:700;line-height:1.35;letter-spacing:-.01em;text-wrap:balance}
.hook{margin:0;color:var(--ink-2);font-size:15px}
.num-row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.num-row b{font-family:var(--f-num);font-weight:300;font-size:38px;line-height:1.1;letter-spacing:-.02em}
.points{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.points li{display:grid;grid-template-columns:10px 1fr;gap:10px;font-size:15px}
.points li::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--ink-3);margin-top:10px}
.why b{display:block;font-size:12px;font-weight:500;color:var(--ink-3);margin-bottom:2px}
.sources{display:flex;gap:6px 12px;flex-wrap:wrap;font-size:13px;color:var(--ink-3)}
.sources a{color:var(--ink-2);text-underline-offset:3px;overflow-wrap:anywhere}
.navrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 4px}
.navbtn{width:44px;height:44px;border-radius:50%;background:var(--card);border:1px solid var(--card-edge);box-shadow:var(--shadow);display:grid;place-items:center}
.navbtn:disabled{opacity:.35;cursor:default}
.navbtn svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.count{font-family:var(--f-num);font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.done{align-items:center;text-align:center}
.done .badge{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;margin:8px auto 2px;
  background:radial-gradient(circle at 35% 30%,var(--card-solid),var(--accent-soft));box-shadow:0 12px 36px -8px var(--accent-glow)}
.done .badge svg{width:34px;height:34px;stroke:var(--accent);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.done ul{list-style:none;margin:0;padding:0;width:100%;display:flex;flex-direction:column;gap:8px;text-align:left}
.done li{display:grid;grid-template-columns:88px 1fr;gap:10px;font-size:14px}
.done li span:first-child{font-family:var(--f-num);font-size:12px;color:var(--ink-3);padding-top:2px}

/* archive */
.archive-item{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;padding:16px 18px}
.archive-item .d{font-family:var(--f-num);font-size:20px;font-weight:300}
.archive-item .h{font-size:14px;color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.archive-item .meta{display:flex;flex-direction:column;min-width:0}
.archive-item[aria-current="true"]{outline:1.5px solid var(--ink)}

.empty{text-align:center;padding:36px 22px}
.empty h2{margin:6px 0;font-size:20px}
.empty p{margin:0;color:var(--ink-2)}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none}
.tabbar .capsule{pointer-events:auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;width:100%;max-width:340px;height:var(--tabbar-h);
  padding:0 14px;border-radius:999px;background:var(--card);border:1px solid var(--card-edge);box-shadow:var(--shadow), inset 0 1px 0 var(--card-edge);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--ink-3);min-height:48px;justify-content:center}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--ink);font-weight:500}
.tab[aria-current="page"] svg{stroke-width:2.2}
.go{width:92px;height:56px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:15px;
  display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 12px 28px -6px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,.35);
  transform:translateY(-10px);transition:transform .2s}
.go:active{transform:translateY(-8px) scale(.97)}
.go svg{width:16px;height:16px;fill:currentColor}
.go[aria-current="page"]{box-shadow:0 14px 34px -4px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,.35)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<div class="app" id="app">
  <section class="view" data-view="today" id="v-today">
    <div class="card empty"><h2>正在加载今天的速读</h2><p>每天早上 7 点左右（太平洋时间）更新</p></div>
  </section>
  <section class="view reader" data-view="read" id="v-read" hidden aria-roledescription="carousel" aria-label="今日新闻"></section>
  <section class="view" data-view="archive" id="v-archive" hidden></section>
</div>

<nav class="tabbar" aria-label="主导航">
  <div class="capsule">
    <button class="tab" type="button" data-tab="today" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4v-5h-6v5H5a1 1 0 0 1-1-1z"/></svg>今天
    </button>
    <button class="go" type="button" data-tab="read" aria-label="开始速读">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg>速读
    </button>
    <button class="tab" type="button" data-tab="archive">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>往期
    </button>
  </div>
</nav>

<script src="lib.js"></script>
<script>
(function () {
  "use strict";
  var L = window.NewsLib;
  var CAT = { business: "商业", tech: "科技", ent: "娱乐" };
  var REGION = { cn: "中国", global: "海外" };
  var CRED = { confirmed: "已证实", credible: "高度可信", developing: "进行中" };
  var WEEK = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
  var SVGNS = "http://www.w3.org/2000/svg";

  var state = { index: null, issue: null, tab: "today", read: new Set(), slide: 0 };

  var store = {
    get: function (k) { try { return JSON.parse(window.localStorage.getItem(k) || "null"); } catch (e) { return null; } },
    set: function (k, v) { try { window.localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function svg(tag, attrs) {
    var e = document.createElementNS(SVGNS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }
  function link(name, url) {
    var u = L.safeUrl(url);
    if (!u) return null;
    var a = el("a", null, name || "原文");
    a.href = u; a.target = "_blank"; a.rel = "noopener";
    return a;
  }
  function getJSON(p) {
    return fetch(p, { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error(p); return r.json(); });
  }
  function dateParts(d) {
    var p = d.split("-").map(Number);
    var wd = new Date(Date.UTC(p[0], p[1] - 1, p[2])).getUTCDay();
    return { m: p[1], d: p[2], wd: WEEK[wd] };
  }
  function greeting() {
    var h = Number(new Intl.DateTimeFormat("en-US", { hour: "numeric", hour12: false, timeZone: "America/Los_Angeles" }).format(new Date())) % 24;
    return h < 11 ? "早上好" : h < 18 ? "下午好" : "晚上好";
  }

  /* ---------- views ---------- */
  function emptyCard(title, body) {
    var c = el("div", "card empty");
    c.append(el("h2", null, title), el("p", null, body));
    return c;
  }

  function changeChip(change, dir) {
    var v = L.changeView(dir);
    var c = el("span", "chg " + v.cls, v.glyph + " " + (change || ""));
    return c;
  }

  function sparkline(series, w, h, valueText) {
    var box = el("div", "spark");
    var g = L.sparkGeometry(series, w, h, 6);
    var s = svg("svg", { viewBox: "0 0 " + w + " " + h, role: "img", "aria-label": "走势：" + series.map(function (p) { return (p.x || "") + " " + p.y; }).join("，") });
    s.append(svg("path", { d: g.area, class: "area" }), svg("path", { d: g.line, class: "line" }), svg("circle", { cx: g.last.x, cy: g.last.y, r: 4.5, class: "end" }));
    box.appendChild(s);
    if (valueText) {
      var b = el("span", "bubble", valueText);
      b.style.left = (g.last.x / w * 100) + "%";
      b.style.top = (g.last.y / h * 100) + "%";
      if (g.last.x / w > 0.85) b.style.transform = "translate(-85%,-130%)";
      box.appendChild(b);
    }
    var t = el("div", "ticks");
    var xs = series.map(function (p) { return p.x || ""; });
    var pick = xs.length <= 5 ? xs : [xs[0], xs[Math.floor(xs.length / 2)], xs[xs.length - 1]];
    pick.forEach(function (x) { t.appendChild(el("span", null, x)); });
    box.appendChild(t);
    return box;
  }

  function renderToday() {
    var v = document.getElementById("v-today");
    v.replaceChildren();
    var I = state.issue;
    if (!I) { v.appendChild(emptyCard("还没有内容", "第一期会在每天早上 7 点左右（太平洋时间）自动出现")); return; }
    var S = I.stories || [];
    var dp = dateParts(I.date);

    var top = el("header", "top");
    var left = el("div");
    left.append(el("div", "date", dp.m + "月" + dp.d + "日 " + dp.wd), el("h1", null, greeting() + "，今天 " + S.length + " 条"));
    var ring = el("div", "ring"); ring.id = "ring";
    var rs = svg("svg", { viewBox: "0 0 52 52", "aria-hidden": "true" });
    rs.append(svg("circle", { cx: 26, cy: 26, r: 22, class: "t" }), svg("circle", { cx: 26, cy: 26, r: 22, class: "b", transform: "rotate(-90 26 26)", "stroke-dasharray": "138.2", "stroke-dashoffset": "138.2" }));
    ring.append(rs, el("span"));
    top.append(left, ring);
    v.appendChild(top);

    if (I.hero) {
      var H = I.hero, hc = el("article", "card hero");
      var head = el("div", "head");
      var hl = el("div");
      hl.appendChild(el("div", "label", H.label));
      var bn = el("div", "bignum");
      bn.append(el("b", null, H.value));
      if (H.unit) bn.append(el("i", null, H.unit));
      hl.appendChild(bn);
      head.appendChild(hl);
      if (H.change || H.dir) head.appendChild(changeChip(H.change, H.dir));
      hc.appendChild(head);
      if (Array.isArray(H.series) && H.series.length >= 2) hc.appendChild(sparkline(H.series, 320, 92, H.value));
      var sl = el("div", "small src-line");
      var a = H.source && link(H.source.name || "来源", H.source.url);
      sl.append("来源 ");
      if (a) sl.appendChild(a);
      hc.appendChild(sl);
      v.appendChild(hc);
    }

    var m = L.mixStats(S), mc = el("article", "card mix");
    mc.appendChild(el("div", "label", "今天的构成"));
    var bar = el("div", "bar"); bar.setAttribute("aria-hidden", "true");
    if (m.cn) { var a1 = el("span", "seg-cn"); a1.style.flex = m.cn; bar.appendChild(a1); }
    if (m.global) { var a2 = el("span", "seg-gl"); a2.style.flex = m.global; bar.appendChild(a2); }
    if (!S.length) { var a3 = el("span", "seg-gl"); a3.style.flex = 1; bar.appendChild(a3); }
    mc.appendChild(bar);
    var lg = el("div", "legend");
    var l1 = el("span", "label", "中国"); l1.appendChild(el("b", null, String(m.cn)));
    var l2 = el("span", "label", "海外"); l2.appendChild(el("b", null, String(m.global)));
    lg.append(l1, l2);
    mc.appendChild(lg);
    var cats = el("div", "cats");
    Object.keys(CAT).forEach(function (k) {
      if (!m.byCat[k]) return;
      var p = el("span", "pill", CAT[k]); p.appendChild(el("b", null, String(m.byCat[k]))); cats.appendChild(p);
    });
    mc.appendChild(cats);
    v.appendChild(mc);

    var t = el("article", "card tldr");
    t.appendChild(el("h2", null, "三句话看完今天"));
    var ol = el("ol");
    (I.tldr || []).forEach(function (x) { ol.appendChild(el("li", null, x)); });
    t.appendChild(ol);
    if (I.takeaway) t.appendChild(el("div", "takeaway", I.takeaway));
    v.appendChild(t);

    if ((I.markets || []).length) {
      var row = el("div", "markets");
      row.setAttribute("aria-label", "市场");
      I.markets.forEach(function (x) {
        var c = el("div", "card mkt");
        c.append(el("div", "label", x.label), el("div", "v", x.value));
        if (x.change || x.dir) c.appendChild(changeChip(x.change, x.dir));
        row.appendChild(c);
      });
      v.appendChild(row);
    }
    v.appendChild(el("p", "label", "覆盖 " + (I.window_pt || "") + " · 信息截至 " + (I.cutoff_pt || "")));
    updateRing();
  }

  function storySlide(s, i, n) {
    var c = el("article", "card slide");
    c.dataset.id = s.id; c.dataset.i = i;
    c.setAttribute("aria-roledescription", "slide");
    c.setAttribute("aria-label", (i + 1) + " / " + n);
    var tags = el("div", "tags");
    if (s.importance === "high") tags.appendChild(el("span", "tag key", "重点"));
    tags.appendChild(el("span", "tag", REGION[s.region] || "海外"));
    if (CAT[s.category]) tags.appendChild(el("span", "tag", CAT[s.category]));
    if (s.credibility === "developing") tags.appendChild(el("span", "tag dev", "进行中"));
    c.append(tags, el("h2", null, s.title));
    if (s.hook) c.appendChild(el("p", "hook", s.hook));
    if (s.headline_number && s.headline_number.value) {
      var nr = el("div", "num-row");
      nr.append(el("b", null, s.headline_number.value), el("span", "label", s.headline_number.label || ""));
      c.appendChild(nr);
    }
    if (s.chart && Array.isArray(s.chart.points) && s.chart.points.length >= 2) {
      var last = s.chart.points[s.chart.points.length - 1];
      c.appendChild(sparkline(s.chart.points, 320, 70, String(last.y) + (s.chart.unit || "")));
    }
    if ((s.points || []).length) {
      var ul = el("ul", "points");
      s.points.forEach(function (p) { ul.appendChild(el("li", null, p)); });
      c.appendChild(ul);
    }
    if (s.why) {
      var w = el("div", "well why");
      w.append(el("b", null, "跟你有什么关系"), document.createTextNode(s.why));
      c.appendChild(w);
    }
    var src = el("div", "sources");
    src.appendChild(el("span", null, (CRED[s.credibility] || "") + " · 来源"));
    (s.sources || []).forEach(function (x) { var a = link(x.name, x.url); if (a) src.appendChild(a); });
    c.appendChild(src);
    return c;
  }

  function doneSlide() {
    var c = el("article", "card slide done");
    c.dataset.i = "done";
    var b = el("div", "badge");
    var s = svg("svg", { viewBox: "0 0 24 24", "aria-hidden": "true" });
    s.appendChild(svg("path", { d: "M5 12.5l4.5 4.5L19 7.5" }));
    b.appendChild(s);
    c.append(b, el("h2", null, "今天读完了"), el("p", "hook", "明早 7 点左右更新下一期"));
    var up = state.issue.upcoming || [];
    if (up.length) {
      var w = el("div", "well"); w.style.width = "100%";
      w.appendChild(el("div", "sec-title", "接下来 72 小时"));
      var ul = el("ul");
      up.forEach(function (u) { var li = el("li"); li.append(el("span", null, u.when), el("span", null, u.what)); ul.appendChild(li); });
      w.appendChild(ul);
      c.appendChild(w);
    }
    return c;
  }

  function renderRead() {
    var v = document.getElementById("v-read");
    v.replaceChildren();
    var I = state.issue;
    var S = (I && I.stories) || [];
    if (!S.length) { v.appendChild(emptyCard("今天没有可读的内容", "没有通过核查的新闻时，这一期就是空的")); return; }
    var dots = el("div", "dots");
    S.forEach(function (s, i) { var d = el("span", "dot"); d.dataset.i = i; dots.appendChild(d); });
    var track = el("div", "track"); track.id = "track"; track.tabIndex = 0;
    S.forEach(function (s, i) { track.appendChild(storySlide(s, i, S.length)); });
    track.appendChild(doneSlide());
    var nav = el("div", "navrow");
    var prev = el("button", "navbtn"); prev.type = "button"; prev.setAttribute("aria-label", "上一条");
    var ps = svg("svg", { viewBox: "0 0 24 24", "aria-hidden": "true" }); ps.appendChild(svg("path", { d: "M15 5l-7 7 7 7" })); prev.appendChild(ps);
    var next = el("button", "navbtn"); next.type = "button"; next.setAttribute("aria-label", "下一条");
    var ns = svg("svg", { viewBox: "0 0 24 24", "aria-hidden": "true" }); ns.appendChild(svg("path", { d: "M9 5l7 7-7 7" })); next.appendChild(ns);
    var count = el("span", "count"); count.id = "count"; count.setAttribute("aria-live", "polite");
    prev.addEventListener("click", function () { go(state.slide - 1); });
    next.addEventListener("click", function () { go(state.slide + 1); });
    nav.append(prev, count, next);
    v.append(dots, nav, track);

    var t;
    track.addEventListener("scroll", function () {
      clearTimeout(t);
      t = setTimeout(function () { setSlide(Math.round(track.scrollLeft / slideWidth(track))); }, 60);
    }, { passive: true });
    var startIdx = S.findIndex(function (s) { return !state.read.has(s.id); });
    state.slide = -1;
    setSlide(startIdx < 0 ? S.length : startIdx);
    requestAnimationFrame(function () { track.scrollLeft = state.slide * slideWidth(track); });
  }

  function slideWidth(track) {
    var first = track.firstElementChild;
    return first ? first.getBoundingClientRect().width + 12 : 1;
  }

  function go(i) {
    var track = document.getElementById("track");
    if (!track) return;
    var n = track.children.length;
    i = Math.max(0, Math.min(n - 1, i));
    setSlide(i);
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    track.scrollTo({ left: i * slideWidth(track), behavior: reduce ? "auto" : "smooth" });
  }

  function setSlide(i) {
    var S = state.issue.stories;
    var total = S.length + 1;
    i = Math.max(0, Math.min(total - 1, i));
    if (i === state.slide) return;
    var changed = state.slide !== -1;
    state.slide = i;
    if (changed && window.scrollY > 0) window.scrollTo(0, 0);
    if (i < S.length) markRead(S[i].id);
    if (i === S.length) S.forEach(function (s) { markRead(s.id); });
    document.querySelectorAll(".dots .dot").forEach(function (d, k) {
      d.classList.toggle("seen", state.read.has(S[k].id));
      if (k === i) d.setAttribute("aria-current", "true"); else d.removeAttribute("aria-current");
    });
    var c = document.getElementById("count");
    if (c) c.textContent = i < S.length ? (i + 1) + " / " + S.length : "读完了";
    var btns = document.querySelectorAll(".navrow .navbtn");
    if (btns.length) { btns[0].disabled = i === 0; btns[1].disabled = i === total - 1; }
  }

  function markRead(id) {
    if (state.read.has(id)) return;
    state.read.add(id);
    store.set("read:" + state.issue.date, Array.from(state.read));
    updateRing();
  }

  function updateRing() {
    var ring = document.getElementById("ring");
    if (!ring || !state.issue) return;
    var S = state.issue.stories || [];
    var n = S.filter(function (s) { return state.read.has(s.id); }).length;
    ring.querySelector(".b").setAttribute("stroke-dashoffset", (138.2 * (1 - (S.length ? n / S.length : 0))).toFixed(1));
    ring.querySelector("span").textContent = n + "/" + S.length;
    ring.setAttribute("aria-label", "已读 " + n + " / " + S.length);
    ring.setAttribute("role", "img");
  }

  function renderArchive() {
    var v = document.getElementById("v-archive");
    v.replaceChildren();
    var top = el("header", "top");
    top.appendChild(el("h1", null, "往期"));
    v.appendChild(top);
    var list = (state.index && state.index.issues) || [];
    if (!list.length) { v.appendChild(emptyCard("还没有往期", "每天的速读都会留在这里")); return; }
    list.forEach(function (it) {
      var b = el("button", "card archive-item"); b.type = "button"; b.dataset.date = it.date;
      if (state.issue && state.issue.date === it.date) b.setAttribute("aria-current", "true");
      var dp = dateParts(it.date);
      var meta = el("span", "meta");
      meta.append(el("span", "d", dp.m + "/" + dp.d), el("span", "h", it.headline || ""));
      b.append(meta, el("span", "small", dp.wd + " · " + (it.count || 0) + " 条"));
      b.addEventListener("click", function () { load(it.date).then(function () { setTab("today"); }); });
      v.appendChild(b);
    });
  }

  function setTab(tab) {
    state.tab = tab;
    store.set("tab", tab);
    ["today", "read", "archive"].forEach(function (k) {
      document.getElementById("v-" + k).hidden = k !== tab;
    });
    document.querySelectorAll(".tabbar [data-tab]").forEach(function (b) {
      if (b.dataset.tab === tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
    });
    if (tab === "read") renderRead();
    if (tab === "archive") renderArchive();
    window.scrollTo(0, 0);
  }

  function load(date) {
    return getJSON("data/" + date + ".json").then(function (issue) {
      state.issue = issue;
      state.read = new Set(store.get("read:" + date) || []);
      renderToday();
    }).catch(function () {
      state.issue = null;
      state.read = new Set();
      var v = document.getElementById("v-today");
      v.replaceChildren(emptyCard("这一期没能打开", "网络可能断了，稍后下拉刷新，或去「往期」换一天"));
    });
  }

  document.querySelectorAll(".tabbar [data-tab]").forEach(function (b) {
    b.addEventListener("click", function () { setTab(b.dataset.tab); });
  });
  document.addEventListener("keydown", function (e) {
    if (state.tab !== "read") return;
    if (e.key === "ArrowRight") { e.preventDefault(); go(state.slide + 1); }
    if (e.key === "ArrowLeft") { e.preventDefault(); go(state.slide - 1); }
  });

  getJSON("data/index.json").then(function (index) {
    state.index = index;
    var dates = (index.issues || []).map(function (i) { return i.date; });
    if (!dates.length) { renderToday(); return; }
    var want = location.hash.slice(1);
    return load(dates.indexOf(want) >= 0 ? want : dates[0]);
  }).catch(function () { renderToday(); });
})();
</script>
